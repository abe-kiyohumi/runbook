<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ランニング手帳</title>
<meta name="theme-color" content="#17a078">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ラン手帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: shared-calendar app — month grid with colored labels on top, selected-day panel below, bottom tab bar + floating add button */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#eef3f0; --ink:#1c2925; --muted:#66766f; --line:#dde5e1;
  --accent:#17a078; --accent-ink:#ffffff; --accent-soft:#dff3ea;
  --sat:#2f6fd6; --sun:#d6453d; --warn:#c77a12; --warn-soft:#fdf1dd; --bad:#c9413a; --bad-soft:#fbe4e2;
  --c-easy:#2e9f68; --c-recovery:#4a9bd8; --c-long:#e88a2c; --c-threshold:#d9534a; --c-interval:#8a5cd6; --c-race:#d6559a; --c-rest:#97a39e; --c-run:#1c2925;
  --chip-ink:#ffffff;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#171f1c; --surface-2:#1f2925; --ink:#e4ece8; --muted:#94a49d; --line:#29342f;
  --accent:#36c493; --accent-ink:#06261b; --accent-soft:#173a2e;
  --sat:#6d9ff0; --sun:#ef7a72; --warn:#e9a440; --warn-soft:#3a2c12; --bad:#ef7a72; --bad-soft:#3b1d1b;
  --c-easy:#2f9a66; --c-recovery:#3f86bd; --c-long:#c9761f; --c-threshold:#c04a42; --c-interval:#7552ba; --c-race:#bb4a87; --c-rest:#5d6a65; --c-run:#d9e4df;
  --chip-ink:#ffffff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#171f1c; --surface-2:#1f2925; --ink:#e4ece8; --muted:#94a49d; --line:#29342f;
  --accent:#36c493; --accent-ink:#06261b; --accent-soft:#173a2e;
  --sat:#6d9ff0; --sun:#ef7a72; --warn:#e9a440; --warn-soft:#3a2c12; --bad:#ef7a72; --bad-soft:#3b1d1b;
  --c-easy:#2f9a66; --c-recovery:#3f86bd; --c-long:#c9761f; --c-threshold:#c04a42; --c-interval:#7552ba; --c-race:#bb4a87; --c-rest:#5d6a65; --c-run:#d9e4df;
  --chip-ink:#ffffff; color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:8px}
.month{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.02em;flex:1;display:flex;align-items:baseline;gap:6px}
.month small{font-size:13px;color:var(--muted);font-weight:500}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--surface-2)}
.todaybtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.dow{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.dow span:nth-child(6){color:var(--sat)} .dow span:nth-child(7){color:var(--sun)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border-radius:0 0 var(--r) var(--r);overflow:hidden;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)) + 6px)}
.cell{min-height:78px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 2px 4px;display:flex;flex-direction:column;gap:2px;background:transparent;border-top:0;border-left:0;text-align:left;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--surface-2)}
.cell.out .d{opacity:.45}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.d{font-size:12px;font-weight:700;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;margin-left:1px}
.cell.sat .d{color:var(--sat)} .cell.sun .d,.cell.hol .d{color:var(--sun)}
.cell.today .d{background:var(--accent);color:var(--accent-ink)}
.chip{display:block;font-size:10px;line-height:15px;font-weight:700;color:var(--chip-ink);border-radius:4px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.plan.done{opacity:.45;text-decoration:line-through}
.chip.run{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--c-run)}
.chip.run.hi{box-shadow:inset 0 0 0 1.5px var(--bad);color:var(--bad)}
.t-easy{background:var(--c-easy)} .t-recovery{background:var(--c-recovery)} .t-long{background:var(--c-long)} .t-threshold{background:var(--c-threshold)} .t-interval{background:var(--c-interval)} .t-race{background:var(--c-race)} .t-rest{background:var(--c-rest)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted);padding:10px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* panels */
.section{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-family:var(--f-display);font-size:17px;margin:0;font-weight:700}
.sec-h .sub{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--chip-ink);border-radius:999px;padding:2px 9px;flex:none}
.big{font-size:22px;font-weight:700;font-family:var(--f-display)}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);font-size:13px;background:transparent}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-size:17px;font-family:var(--f-display)}
.stat span{font-size:11px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.runitem{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:12px 14px;border:0;text-align:left;width:100%}
.runitem .dt{width:44px;flex:none;text-align:center;font-family:var(--f-display)}
.runitem .dt b{display:block;font-size:20px;line-height:1}
.runitem .mid{flex:1;min-width:0}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.ok{background:var(--accent-soft);color:var(--accent)}
.note{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--warn-soft);color:var(--ink)}
.note.bad{background:var(--bad-soft)}
.note.ok{background:var(--accent-soft)}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.decl{font-weight:700;font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 10px}
.prop{display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.prop:first-child{border-top:0}

/* tabs + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:transparent;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--accent)}
.tab svg{width:22px;height:22px}
.fab{position:fixed;z-index:26;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet h3{font-family:var(--f-display);font-size:19px;margin:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field textarea,.field select{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 11px;min-width:0;width:100%;box-sizing:border-box}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.scale.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 0;font-weight:700;font-size:14px}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types button{border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--chip-ink);opacity:.4}
.types button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:var(--r);padding:22px 12px;text-align:center;background:var(--surface);cursor:pointer}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.thumb{max-height:220px;width:auto;max-width:100%;border-radius:10px;align-self:center}
.toggle{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:500}
.toggle input{width:20px;height:20px;accent-color:var(--bad)}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.splits{display:flex;flex-direction:column;gap:4px}
.split{display:grid;grid-template-columns:28px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:12px}
.split .bar>i{background:var(--c-easy)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:60;font-weight:700}
.banner{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="iconbtn" id="prev" aria-label="前の月"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="month" id="monthLabel">—</div>
    <button class="todaybtn" id="todayBtn">今日</button>
    <button class="iconbtn" id="next" aria-label="次の月"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="dow" id="dowRow"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div>
</header>

<main class="wrap" id="main"></main>

<button class="fab" id="fab" aria-label="ランを記録"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs" role="tablist">
  <div class="tabs-in">
    <button class="tab" role="tab" data-tab="cal" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>カレンダー</button>
    <button class="tab" role="tab" data-tab="weeks" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>週のまとめ</button>
    <button class="tab" role="tab" data-tab="log" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>記録</button>
  </div>
</nav>

<div id="sheetRoot"></div>

<script src="app.js"></script>
</body>
</html>
